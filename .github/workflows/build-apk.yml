name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package mobile WebView assets
        run: |
          mkdir -p android-app/app/src/main/assets/www
          cp -r mobile-www/* android-app/app/src/main/assets/www/
          ls -la android-app/app/src/main/assets/www/
          test -f android-app/app/src/main/assets/www/index.html

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatHub-Minimal-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ChatHub Minimal APK #${{ github.run_number }}
          body: |
            ## ChatHub Minimal (Android)

            تطبيق مستقل (مش إكستنشن جوه WebView) — **مفيش شاشة سودة**.

            ### الميزات
            - واجهة شات جاهزة فور الفتح
            - Premium / بدون Lemon Squeezy
            - OpenAI · Claude · Gemini · OpenRouter عبر **API keys**
            - المفاتيح تتخزن محليًا على الجهاز فقط

            ### التثبيت
            1. نزّل الـ APK
            2. اسمح بتثبيت من مصادر غير معروفة
            3. افتح التطبيق → ⚙ → حط API key → ابدأ المحادثة

            ### ملاحظة
            جلسات Claude/ChatGPT من الموقع أفضل في **Kiwi + الإكستنشن**.  
            هذا الـ APK مصمم ليعمل بشكل موثوق عبر API keys.
          files: android-app/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
