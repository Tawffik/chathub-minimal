name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack & install
        run: |
          corepack enable
          yarn install --immutable || yarn install

      - name: Build extension dist
        run: yarn build

      - name: Prepare WebView assets
        run: |
          mkdir -p android-app/app/src/main/assets/www
          cp -r dist/* android-app/app/src/main/assets/www/
          if [ -f android-app/app/src/main/assets/www/app.html ]; then
            echo "app.html ready"
          else
            echo "WARNING: app.html missing"
            ls -la android-app/app/src/main/assets/www/ | head -30
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatHub-Minimal-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ChatHub Minimal APK #${{ github.run_number }}
          body: |
            ## ChatHub Minimal for Android
            - Premium unlocked
            - No Lemon Squeezy / no license checks
            - Telemetry minimized

            **Install:** download the APK → allow unknown sources → install.

            **Note:** For Claude/ChatGPT web session, Kiwi Browser + extension `dist` is more reliable. This APK is a WebView shell; use API keys in Settings when possible.
          files: android-app/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
