name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack & install
        run: |
          corepack enable
          yarn install --immutable || yarn install

      - name: Build extension dist
        run: yarn build

      - name: Prepare WebView assets
        run: |
          mkdir -p android-app/app/src/main/assets/www
          cp -r dist/* android-app/app/src/main/assets/www/
          # Ensure app.html is at root of www
          if [ -f android-app/app/src/main/assets/www/app.html ]; then
            echo "app.html ready"
          else
            echo "WARNING: app.html missing"
            ls -la android-app/app/src/main/assets/www/ | head -30
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute for gradlew (if present)
        run: |
          cd android-app
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2.1 || true
          fi
          chmod +x gradlew 2>/dev/null || true

      - name: Build debug APK with Gradle
        working-directory: android-app
        run: |
          # Generate wrapper if needed
          if [ ! -f gradlew ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.2.1-bin.zip -o /tmp/gradle.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
            /opt/gradle-8.2.1/bin/gradle wrapper --gradle-version 8.2.1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatHub-Minimal-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release (on main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ChatHub Minimal APK #${{ github.run_number }}
          body: |
            ## ChatHub Minimal for Android
            - Premium unlocked
            - No Lemon Squeezy / no license checks
            - Telemetry minimized

            **Install:** download the APK, enable "Install unknown apps" for your browser/file manager, then install.

            **Note:** Web-session bots (Claude/ChatGPT login) work best in Kiwi Browser with the extension `dist`. This APK is a WebView shell of the same UI; prefer API keys in Settings for reliable mobile use.
          files: android-app/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
