<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>ChatHub Minimal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">CH</span>
        <div>
          <div class="title">ChatHub Minimal</div>
          <div class="subtitle">Premium · بدون ترخيص</div>
        </div>
      </div>
      <button id="btnSettings" class="icon-btn" title="Settings">⚙</button>
    </header>

    <div class="toolbar">
      <select id="modelSelect"></select>
      <button id="btnNew" class="chip">محادثة جديدة</button>
    </div>

    <main id="messages" class="messages"></main>

    <footer class="composer">
      <textarea id="input" rows="1" placeholder="اكتب رسالتك..."></textarea>
      <button id="btnSend" class="send">إرسال</button>
    </footer>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>الإعدادات / API Keys</h2>
        <button id="btnCloseSettings" class="icon-btn">✕</button>
      </div>
      <p class="hint">التطبيق شغال محليًا. حط مفاتيحك هنا (بتتخزن على الجهاز فقط).</p>

      <label>OpenAI API Key
        <input id="keyOpenAI" type="password" placeholder="sk-..." autocomplete="off" />
      </label>
      <label>Anthropic (Claude) API Key
        <input id="keyAnthropic" type="password" placeholder="sk-ant-..." autocomplete="off" />
      </label>
      <label>Google Gemini API Key
        <input id="keyGemini" type="password" placeholder="AIza..." autocomplete="off" />
      </label>
      <label>OpenRouter API Key
        <input id="keyOpenRouter" type="password" placeholder="sk-or-..." autocomplete="off" />
      </label>

      <div class="modal-actions">
        <button id="btnSaveKeys" class="primary">حفظ</button>
      </div>
      <p class="foot">Claude/ChatGPT من جلسة الموقع أفضل في Kiwi + الإكستنشن. الـ APK مصمّم لـ API keys.</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
